<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 520" width="100%" height="auto">
  <defs>
    <linearGradient id="archBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090d16"/>
      <stop offset="100%" stop-color="#111827"/>
    </linearGradient>
    <linearGradient id="glowG" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#06b6d4"/>
    </linearGradient>
  </defs>

  <rect width="1000" height="520" rx="16" fill="url(#archBg)"/>

  <!-- Top Title -->
  <text x="500" y="44" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="20" font-weight="900" fill="#ffffff" text-anchor="middle">
    🏛️ Glow &amp; Care Full Modular Architecture
  </text>
  <text x="500" y="66" font-family="sans-serif" font-size="12" fill="#94a3b8" text-anchor="middle">
    Laravel 12.x • Filament v3 • 7 Specialized Packagist Engines • Bangladeshi Logistics &amp; POS
  </text>

  <!-- 3 Main Pillars -->
  <!-- Pillar 1: Public Frontend -->
  <g transform="translate(40, 95)">
    <rect width="280" height="385" rx="12" fill="#1e293b" stroke="#334155" stroke-width="1"/>
    <rect width="280" height="36" rx="12" fill="#0f172a"/>
    <text x="140" y="24" font-family="sans-serif" font-size="12" font-weight="800" fill="#38bdf8" text-anchor="middle">
      1. PUBLIC CUSTOMER FACING
    </text>

    <g transform="translate(16, 50)" font-family="sans-serif" font-size="11">
      <rect width="248" height="42" rx="6" fill="#0f172a" stroke="#334155"/>
      <text x="12" y="20" font-weight="700" fill="#f8fafc">Single-Funnel Landing Pages</text>
      <text x="12" y="34" font-size="9" fill="#94a3b8">/landing/{slug} • 1-Click COD checkout</text>

      <rect y="52" width="248" height="42" rx="6" fill="#0f172a" stroke="#334155"/>
      <text x="12" y="72" font-weight="700" fill="#f8fafc">Public eCommerce Storefront</text>
      <text x="12" y="86" font-size="9" fill="#94a3b8">/shop • Skin types &amp; concerns filter</text>

      <rect y="104" width="248" height="42" rx="6" fill="#0f172a" stroke="#334155"/>
      <text x="12" y="124" font-weight="700" fill="#f8fafc">AI Skin Diagnostic Quiz</text>
      <text x="12" y="138" font-size="9" fill="#94a3b8">/skin-quiz • 4-step diagnostic wizard</text>

      <rect y="156" width="248" height="42" rx="6" fill="#0f172a" stroke="#334155"/>
      <text x="12" y="176" font-weight="700" fill="#f8fafc">1-Click Demo Login Hub</text>
      <text x="12" y="190" font-size="9" fill="#94a3b8">/demo • 6 Personas with instant bypass</text>

      <rect y="208" width="248" height="42" rx="6" fill="#0f172a" stroke="#334155"/>
      <text x="12" y="228" font-weight="700" fill="#f8fafc">Showrooms &amp; WhatsApp</text>
      <text x="12" y="242" font-size="9" fill="#94a3b8">/contact • Banani, Dhanmondi, CTG</text>

      <rect y="260" width="248" height="55" rx="6" fill="#059669" fill-opacity="0.15" stroke="#059669"/>
      <text x="12" y="280" font-weight="700" fill="#34d399">Dynamic Shipping Engine</text>
      <text x="12" y="294" font-size="9" fill="#a7f3d0">Dhaka: ৳60 | Sub: ৳100 | Out: ৳130</text>
      <text x="12" y="306" font-size="8" fill="#6ee7b7">Real-time JS total breakdown</text>
    </g>
  </g>

  <!-- Pillar 2: Filament Admin Panel -->
  <g transform="translate(360, 95)">
    <rect width="280" height="385" rx="12" fill="#1e293b" stroke="#334155" stroke-width="1"/>
    <rect width="280" height="36" rx="12" fill="#0f172a"/>
    <text x="140" y="24" font-family="sans-serif" font-size="12" font-weight="800" fill="#34d399" text-anchor="middle">
      2. FILAMENT V3 CONTROL SUITE
    </text>

    <g transform="translate(16, 50)" font-family="sans-serif" font-size="11">
      <rect width="248" height="42" rx="6" fill="#0f172a" stroke="#334155"/>
      <text x="12" y="20" font-weight="700" fill="#f8fafc">Touchscreen Barcode POS</text>
      <text x="12" y="34" font-size="9" fill="#94a3b8">PosTerminal • 80mm Bangla Receipt</text>

      <rect y="52" width="248" height="42" rx="6" fill="#0f172a" stroke="#334155"/>
      <text x="12" y="72" font-weight="700" fill="#f8fafc">Orders &amp; Steadfast API</text>
      <text x="12" y="86" font-size="9" fill="#94a3b8">1-Click parcel booking &amp; sync</text>

      <rect y="104" width="248" height="42" rx="6" fill="#0f172a" stroke="#334155"/>
      <text x="12" y="124" font-weight="700" fill="#f8fafc">Multi-Branch Inventory</text>
      <text x="12" y="138" font-size="9" fill="#94a3b8">Requisition &amp; Stock Challans</text>

      <rect y="156" width="248" height="42" rx="6" fill="#0f172a" stroke="#334155"/>
      <text x="12" y="176" font-weight="700" fill="#f8fafc">Batch &amp; Expiry Alert Engine</text>
      <text x="12" y="190" font-size="9" fill="#94a3b8">BSTI validation &amp; 30/60/90 day alerts</text>

      <rect y="208" width="248" height="42" rx="6" fill="#0f172a" stroke="#334155"/>
      <text x="12" y="228" font-weight="700" fill="#f8fafc">Clinic &amp; Dermatologist</text>
      <text x="12" y="242" font-size="9" fill="#94a3b8">Prescriptions &amp; patient consults</text>

      <rect y="260" width="248" height="55" rx="6" fill="#059669" fill-opacity="0.15" stroke="#059669"/>
      <text x="12" y="280" font-weight="700" fill="#34d399">Business Modules Switcher</text>
      <text x="12" y="294" font-size="9" fill="#a7f3d0">Toggle POS, Funnel, Clinic, AI, etc.</text>
      <text x="12" y="306" font-size="8" fill="#6ee7b7">Instant feature enable/disable</text>
    </g>
  </g>

  <!-- Pillar 3: 7 Integrated Core Packages -->
  <g transform="translate(680, 95)">
    <rect width="280" height="385" rx="12" fill="#1e293b" stroke="#334155" stroke-width="1"/>
    <rect width="280" height="36" rx="12" fill="#0f172a"/>
    <text x="140" y="24" font-family="sans-serif" font-size="12" font-weight="800" fill="#c084fc" text-anchor="middle">
