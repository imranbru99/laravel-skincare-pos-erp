    </text>

    <g transform="translate(16, 50)" font-family="sans-serif" font-size="10">
      <rect width="248" height="32" rx="5" fill="#0f172a" stroke="#334155"/>
      <text x="10" y="20" font-family="monospace" font-weight="700" fill="#38bdf8">imrandevbd/drutogoti</text>

      <rect y="38" width="248" height="32" rx="5" fill="#0f172a" stroke="#334155"/>
      <text x="10" y="58" font-family="monospace" font-weight="700" fill="#38bdf8">imrandevbd/laravel-admin-panel</text>

      <rect y="76" width="248" height="32" rx="5" fill="#0f172a" stroke="#334155"/>
      <text x="10" y="96" font-family="monospace" font-weight="700" fill="#38bdf8">imrandevbd/laravel-ai-catalog</text>

      <rect y="114" width="248" height="32" rx="5" fill="#0f172a" stroke="#334155"/>
      <text x="10" y="134" font-family="monospace" font-weight="700" fill="#38bdf8">imrandevbd/laravel-ai-hub</text>

      <rect y="152" width="248" height="32" rx="5" fill="#0f172a" stroke="#334155"/>
      <text x="10" y="172" font-family="monospace" font-weight="700" fill="#38bdf8">imrandevbd/laravel-attendance-hub</text>

      <rect y="190" width="248" height="32" rx="5" fill="#0f172a" stroke="#334155"/>
      <text x="10" y="210" font-family="monospace" font-weight="700" fill="#38bdf8">imrandevbd/laravel-unicode-pdf</text>

      <rect y="228" width="248" height="32" rx="5" fill="#0f172a" stroke="#334155"/>
      <text x="10" y="248" font-family="monospace" font-weight="700" fill="#38bdf8">imrandevbd/laravel-universal-slug</text>

      <rect y="268" width="248" height="45" rx="6" fill="#7c3aed" fill-opacity="0.2" stroke="#a78bfa"/>
      <text x="10" y="286" font-weight="700" fill="#c4b5fd">Steadfast &amp; Pathao APIs</text>
      <text x="10" y="300" font-size="9" fill="#e9d5ff">Auto Parcel Dispatch &amp; Return Sync</text>
    </g>
  </g>
</svg>
